<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle Player</title>
<style>
  :root { --bg:#121212; --card:#1e1e1e; --accent:#1db954; --text:#f1f1f1; --muted:#999; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; padding:24px 12px; min-height:100vh; }
  .player { width:100%; max-width:480px; background:var(--card); border-radius:16px; padding:24px; height:fit-content; }
  h1 { margin:0 0 16px; font-size:1.3rem; }
  #drop { border:2px dashed #444; border-radius:12px; padding:20px; text-align:center; color:var(--muted);
          cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #now { margin:20px 0 8px; font-size:1.05rem; font-weight:600; min-height:1.4em; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap; }
  #status { font-size:.8rem; color:var(--err); min-height:1.2em; margin-bottom:6px; }
  .time { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  button { background:#2c2c2c; color:var(--text); border:none; border-radius:999px; padding:12px 16px;
           font-size:.95rem; cursor:pointer; }
  button:hover { background:#3a3a3a; }
  button.main { background:var(--accent); color:#000; font-weight:700; }
  .vol { display:flex; align-items:center; gap:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .count { color:var(--muted); font-size:.8rem; }
  .small { padding:6px 12px; font-size:.8rem; }
  #list { list-style:none; padding:0; margin:8px 0 0; max-height:280px; overflow:auto; font-size:.9rem; }
  #list li { display:flex; align-items:center; gap:6px; padding:4px 4px 4px 8px; border-radius:6px; color:var(--muted); }
  #list li:hover { background:#2a2a2a; }
  #list li.cur { color:var(--accent); font-weight:600; }
  #list .name { flex:1; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:5px 0; }
  #list .del { background:none; padding:4px 9px; color:var(--muted); border-radius:6px; font-size:1rem; }
  #list .del:hover { background:#4a2222; color:var(--err); }
</style>
</head>
<body>
<div class="player">
  <h1>🎵 Shuffle Player</h1>

  <div id="drop">Click or drag &amp; drop your MP3 files here</div>
  <input id="files" type="file" accept="audio/*,video/mp4,video/webm,.mp3,.wav,.ogg,.m4a,.flac,.aac,.opus,.webm,.mp4" multiple hidden>

  <div id="now">Nothing loaded</div>
  <div id="status"></div>
  <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>

  <div class="controls">
    <button id="prev">⏮ Previous</button>
    <button id="play" class="main">▶ Start</button>
    <button id="next">Next ⏭</button>
    <button id="shuffle">🔀 Shuffle</button>
  </div>

  <div class="vol">
    <span>🔊</span>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div class="row">
    <span class="count" id="count"></span>
    <button class="small" id="clear">🗑 Clear all</button>
  </div>
  <ul id="list"></ul>
</div>

<script>
/* ============ State ============ */
let tracks = [];      // {id, name, url, data(ArrayBuffer), fmt}
let queue = [];       // play order
let qpos = -1;        // position in queue
let nextId = 1;
let errorStreak = 0;
let volume = 0.8;
let wantPlay = false; // does the user want music playing right now?
let loadToken = 0;    // invalidates stale async work when the song changes
let dragging = false;

const $ = id => document.getElementById(id);
const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const current = () => queue[qpos] || null;
const setStatus = m => $('status').textContent = m || '';

function shuffle(arr) {
  arr = arr.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============ Two playback engines ============
   1) normal <audio> element
   2) backup: decode the file ourselves with Web Audio (used if the element refuses the file) */
const audio = new Audio();
audio.volume = volume;
let mode = 'el';                       // 'el' or 'wa'
let ctx = null, gainNode = null;
const wa = { buffer: null, src: null, t0: 0, off: 0, playing: false, token: 0 };

function ensureCtx() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    gainNode = ctx.createGain();
    gainNode.gain.value = volume;
    gainNode.connect(ctx.destination);
  }
  return ctx;
}

function stopSrc() {
  if (wa.src) {
    wa.token++;
    try { wa.src.stop(); } catch (e) {}
    try { wa.src.disconnect(); } catch (e) {}
    wa.src = null;
  }
}
function waPos() {
  if (!wa.buffer) return 0;
  return wa.playing ? Math.min(wa.off + ctx.currentTime - wa.t0, wa.buffer.duration) : wa.off;
}
function waStart(off) {
  stopSrc();
  ensureCtx();
  ctx.resume();
  const s = ctx.createBufferSource();
  s.buffer = wa.buffer;
  s.connect(gainNode);
  const tok = ++wa.token;
  s.onended = () => { if (tok === wa.token && wa.playing) { wa.playing = false; next(); } };
  s.start(0, off);
  wa.src = s; wa.off = off; wa.t0 = ctx.currentTime; wa.playing = true;
  updateButton();
}
function waPause() {
  if (!wa.playing) return;
  wa.off = waPos(); wa.playing = false; stopSrc(); updateButton();
}

/* unified helpers */
const isPlaying = () => mode === 'el' ? !audio.paused : wa.playing;
const curTime   = () => mode === 'el' ? audio.currentTime : waPos();
const durTime   = () => mode === 'el' ? audio.duration : (wa.buffer ? wa.buffer.duration : 0);

function pauseAll() { wantPlay = false; mode === 'el' ? audio.pause() : waPause(); }
function resumeAll() {
  wantPlay = true;
  if (mode === 'el') tryPlayEl();
  else if (wa.buffer) waStart(wa.off);       // else: starts as soon as decoding finishes
}
function seekTo(t) {
  if (mode === 'el') audio.currentTime = t;
  else if (wa.buffer) { wa.playing ? waStart(t) : (wa.off = t); }
}
function setVolume(v) {
  volume = v; audio.volume = v;
  if (gainNode) gainNode.gain.value = v;
}
function tryPlayEl() {
  const p = audio.play();
  if (p && p.catch) p.catch(err => { if (err.name !== 'AbortError' && err.name !== 'NotSupportedError') setStatus('Could not play: ' + err.message); });
}

/* ============ Loading a song ============ */
function loadTrack(track, autoplay) {
  loadToken++;
  stopSrc(); wa.playing = false; wa.buffer = null; wa.off = 0;
  audio.pause();
  mode = 'el';
  wantPlay = autoplay;
  setStatus('');
  $('now').textContent = track.name;
  $('seek').value = 0; $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
  audio.src = track.url;
  audio.load();
  if (autoplay) tryPlayEl();
  updateButton();
  renderList();
}

async function useBackupDecoder() {
  const track = current();
  if (!track) return;
  const my = loadToken;
  mode = 'wa';
  stopSrc(); wa.playing = false; wa.buffer = null; wa.off = 0;
  setStatus('Normal playback failed, trying backup decoder…');
  try {
    ensureCtx();
    const buf = await ctx.decodeAudioData(track.data.slice(0));
    if (my !== loadToken) return;
    wa.buffer = buf; wa.off = 0;
    $('dur').textContent = fmt(buf.duration);
    setStatus('');
    errorStreak = 0;
    if (wantPlay) waStart(0);
    updateButton();
  } catch (e) {
    if (my !== loadToken) return;
    errorStreak++;
    setStatus('Can\'t play "' + track.name + '" (detected: ' + track.fmt + '). Both decoders failed: ' +
              (e && e.message ? e.message : e) + '. The file may be damaged.');
    updateButton();
    if (tracks.length > 1 && errorStreak < tracks.length) setTimeout(() => { if (my === loadToken) next(); }, 2000);
  }
}

/* ============ Adding files ============ */
async function sniffType(file) {
  try {
    const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    const str = (a, z) => String.fromCharCode(...b.slice(a, z));
    if (str(0, 3) === 'ID3') return 'audio/mpeg';
    if (b[0] === 0xFF && (b[1] & 0xE0) === 0xE0) return ((b[1] >> 1) & 3) === 0 ? 'audio/aac' : 'audio/mpeg';
    if (str(4, 8) === 'ftyp') return 'audio/mp4';
    if (b[0] === 0x1A && b[1] === 0x45 && b[2] === 0xDF && b[3] === 0xA3) return 'audio/webm';
    if (str(0, 4) === 'OggS') return 'audio/ogg';
    if (str(0, 4) === 'RIFF' && str(8, 12) === 'WAVE') return 'audio/wav';
    if (str(0, 4) === 'fLaC') return 'audio/flac';
  } catch (e) {}
  return file.type || '';
}

async function addFiles(fileList) {
  const files = [...fileList].filter(f =>
    f.type.startsWith('audio/') || f.type.startsWith('video/') ||
    /\.(mp3|wav|ogg|m4a|flac|aac|opus|webm|mp4)$/i.test(f.name));
  if (!files.length) { setStatus('No audio files found in that selection.'); return; }

  const added = [];
  for (const f of files) {
    let data;
    try { data = await f.arrayBuffer(); }
    catch (e) { setStatus('Could not read "' + f.name + '": ' + e.message); continue; }
    const mime = await sniffType(f);
    added.push({
      id: nextId++,
      name: f.name.replace(/\.[^.]+$/, ''),
      fmt: mime || 'unknown',
      data,
      url: URL.createObjectURL(new Blob([data], { type: mime }))
    });
  }
  if (!added.length) return;
  tracks.push(...added);

  if (!current()) { queue = shuffle(tracks); qpos = 0; loadTrack(queue[0], false); }
  else { queue.push(...shuffle(added)); renderList(); }
}

/* ============ Controls ============ */
function next() {
  if (!queue.length) return;
  if (qpos + 1 >= queue.length) {         // all played: reshuffle
    const last = current();
    queue = shuffle(tracks);
    if (queue.length > 1 && queue[0] === last) queue.push(queue.shift());
    qpos = 0;
  } else qpos++;
  loadTrack(current(), true);
}

function prev() {
  if (!queue.length) return;
  if (curTime() > 3 || qpos === 0) { seekTo(0); return; }
  qpos--;
  loadTrack(current(), true);
}

function reshuffle() {
  if (!tracks.length) return;
  const cur = current();
  if (cur && (isPlaying() || curTime() > 0)) {
    queue = [cur, ...shuffle(tracks.filter(t => t !== cur))]; qpos = 0; renderList();
  } else {
    queue = shuffle(tracks); qpos = 0; loadTrack(queue[0], false);
  }
}

function removeTrack(track) {
  const qi = queue.indexOf(track);
  const wasCurrent = qi === qpos;
  const wasPlaying = isPlaying() || wantPlay;
  tracks = tracks.filter(t => t !== track);
  if (qi !== -1) queue.splice(qi, 1);
  if (qi !== -1 && qi < qpos) qpos--;
  URL.revokeObjectURL(track.url);
  if (!tracks.length) { resetPlayer(); return; }
  if (wasCurrent) { if (qpos >= queue.length) qpos = 0; loadTrack(current(), wasPlaying); }
  else renderList();
}

function resetPlayer() {
  loadToken++;
  stopSrc(); wa.playing = false; wa.buffer = null; wa.off = 0;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  tracks.forEach(t => URL.revokeObjectURL(t.url));
  tracks = []; queue = []; qpos = -1; mode = 'el'; wantPlay = false;
  $('now').textContent = 'Nothing loaded';
  $('seek').value = 0; $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
  setStatus(''); updateButton(); renderList();
}

/* ============ UI ============ */
function updateButton() {
  $('play').textContent = isPlaying() ? '⏸ Pause' : '▶ ' + (curTime() > 0 ? 'Resume' : 'Start');
}

function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  queue.forEach((t, i) => {
    const li = document.createElement('li');
    if (t === current()) li.className = 'cur';
    const name = document.createElement('span');
    name.className = 'name'; name.textContent = (i + 1) + '. ' + t.name; name.title = t.name;
    name.onclick = () => { queue = [t, ...shuffle(tracks.filter(x => x !== t))]; qpos = 0; loadTrack(t, true); };
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = 'Remove from list';
    del.onclick = () => removeTrack(t);
    li.append(name, del);
    ul.appendChild(li);
  });
  $('count').textContent = tracks.length ? tracks.length + ' song' + (tracks.length > 1 ? 's' : '') + ' loaded' : '';
}

setInterval(() => {                      // refresh time + seek bar
  if (!current()) return;
  const d = durTime(), c = curTime();
  if (!dragging && d) $('seek').value = c / d * 100;
  $('cur').textContent = fmt(c);
  if (d) $('dur').textContent = fmt(d);
}, 250);

/* ============ Events ============ */
$('play').onclick = () => {
  if (!current()) { setStatus('Add some songs first.'); return; }
  isPlaying() || (wantPlay && mode === 'wa' && !wa.buffer) ? pauseAll() : resumeAll();
  updateButton();
};
$('next').onclick = next;
$('prev').onclick = prev;
$('shuffle').onclick = reshuffle;
$('clear').onclick = () => { if (tracks.length && confirm('Remove all songs from the list?')) resetPlayer(); };
$('vol').oninput = e => setVolume(parseFloat(e.target.value));

const seek = $('seek');
seek.addEventListener('pointerdown', () => dragging = true);
seek.addEventListener('pointerup',   () => dragging = false);
seek.oninput = e => { const d = durTime(); if (d) seekTo(e.target.value / 100 * d); };

audio.onplaying = () => { if (mode === 'el') { errorStreak = 0; setStatus(''); updateButton(); } };
audio.onpause   = () => { if (mode === 'el') updateButton(); };
audio.onended   = () => { if (mode === 'el') next(); };
audio.onerror   = () => {
  if (mode !== 'el' || !audio.getAttribute('src')) return;
  useBackupDecoder();                     // browser refused the file: decode it ourselves
};

$('drop').onclick = () => $('files').click();
$('files').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => addFiles(e.dataTransfer.files));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') next();
  if (e.code === 'ArrowLeft') prev();
});
</script>
</body>
</html>
